name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  production:
    name: Pile de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Le parcours d'un depot fraichement clone : ni .env, ni donnees, ni
      # dist. demarrer.sh doit tout preparer, compilation du client comprise.
      - name: ./demarrer.sh
        run: ./demarrer.sh

      - name: Le conteneur client a produit le binaire du terminal
        run: |
          test -s dist/Inventaire.exe
          test -s dist/version.txt
          curl -fsS "http://127.0.0.1:8080/api/maj" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d); raise SystemExit(0 if d['disponible'] else 1)"

      - name: Le serveur ecrit, la vitrine relit
        run: |
          curl -fsS --output /dev/null \
            "http://127.0.0.1:8080/api/ajouter?code=3017620422003&qte=2&peremption=2030-01-01"
          sleep 3
          curl -fsS -o etat.json http://127.0.0.1:8081/api/etat
          python3 -c "import json; u = json.load(open('etat.json'))['compteurs']['unites']; print('unites vues par la vitrine :', u); raise SystemExit(0 if u >= 2 else 1)"

      - name: Le serveur MCP repond a un client
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' -o mcp.json \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"resume","arguments":{}}}' \
            http://127.0.0.1:8082/mcp
          python3 -c "import json; t = json.load(open('mcp.json'))['result']['content'][0]['text']; print(t); raise SystemExit(0 if 'Frigo' in t else 1)"

      - name: Arret propre
        run: |
          docker compose stop
          for service in frigo-serveur frigo-vitrine frigo-mcp; do
            code="$(docker inspect -f '{{.State.ExitCode}}' "$service")"
            echo "$service : exit $code"
            [ "$code" = 0 ]
          done

      - name: Journaux en cas d'echec
        if: failure()
        run: docker compose logs
